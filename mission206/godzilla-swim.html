<title>Godzilla — Swimming Pose</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(80% 60% at 50% 30%, #18475a 0%, #0a2a38 55%, #06192a 100%);
    display:grid; place-items:center;
    overflow:hidden;
  }
  .stage{
    position: fixed; inset: 0;
    overflow: hidden;
  }
  .frame{
    position: absolute;
    top: 50%; left: 0;
    width: 38vmin;
    aspect-ratio: 16 / 9;
    transform: translate(-100%, -50%);
    filter: drop-shadow(0 14px 40px rgba(0,0,0,.55));
    animation: swimAcross 14s linear infinite;
    will-change: transform, left;
  }
  @keyframes swimAcross{
    0%   { left: -30%; transform: translate(0, -50%) scaleX(1); }
    100% { left: 110%; transform: translate(0, -50%) scaleX(1); }
  }
  svg{ width:100%; height:100%; display:block }
  /* Bubble trail */
  .bubble{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(180,240,255,.25) 60%, transparent 80%);
    pointer-events: none;
    opacity: 0;
  }
  /* gentle caustics overlay */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(circle at 20% 30%, rgba(180,240,255,.18) 0 2px, transparent 4px),
      radial-gradient(circle at 70% 10%, rgba(180,240,255,.14) 0 2px, transparent 4px),
      radial-gradient(circle at 40% 80%, rgba(180,240,255,.10) 0 2px, transparent 4px);
    background-size: 220px 220px, 280px 280px, 200px 200px;
    mix-blend-mode: screen;
    opacity:.5;
    animation: drift 20s linear infinite;
  }
  @keyframes drift{
    0%{ background-position: 0 0, 0 0, 0 0 }
    100%{ background-position: 220px -110px, -280px 140px, 200px -200px }
  }
</style>
</head>

<script>
(function() {
  const BODY_PIVOT_X = 615, BODY_PIVOT_Y = 400;
  const INVERT = new Set(['nElbow','fElbow']);

  function setAngle(joint, angle){
    const g = document.getElementById('jnt-'+joint);
    if (!g) return;
    const px = +g.dataset.px, py = +g.dataset.py;
    const applied = INVERT.has(joint) ? -angle : angle;
    g.setAttribute('transform', `translate(${px} ${py}) rotate(${applied})`);
  }

  const root = document.getElementById('root');
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const t0 = performance.now();
  let lastBubble = 0;

  function spawnBubble(){
    const r = frame.getBoundingClientRect();
    // Emit from the front of the godzilla (head end) within its current screen rect
    const reversed = frame.style.animationName === 'swimAcrossReverse' || getComputedStyle(frame).transform.includes('matrix(-1');
    const xFrac = 0.78 + (Math.random() * 0.10 - 0.05);
    const yFrac = 0.30 + Math.random() * 0.10;
    const cx = r.left + r.width * xFrac;
    const cy = r.top  + r.height * yFrac;
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 4 + Math.random() * 8;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (cx - size/2) + 'px';
    b.style.top  = (cy - size/2) + 'px';
    document.body.appendChild(b);
    const drift = (Math.random() * 30 - 15);
    const rise  = 80 + Math.random() * 80;
    b.animate(
      [
        { transform: 'translate(0,0) scale(.6)', opacity: 0 },
        { transform: `translate(${drift*0.5}px, ${-rise*0.5}px) scale(1)`, opacity: 0.85, offset: 0.25 },
        { transform: `translate(${drift}px, ${-rise}px) scale(1.05)`, opacity: 0 }
      ],
      { duration: 1600 + Math.random() * 800, easing: 'cubic-bezier(.2,.7,.4,1)' }
    );
    setTimeout(() => b.remove(), 2500);
  }

  function loop(t){
    const elapsed = t - t0;
    const phase = (elapsed / 950) % 1;
    const tau = phase * Math.PI * 2;

    // Body tilt + subtle bob (relative to the SVG viewBox)
    const tilt = 28 + Math.sin(tau) * 3.5;
    const bobX = Math.sin(tau) * 6;
    const bobY = Math.cos(tau) * 4;
    root.setAttribute('transform', `translate(${bobX} ${bobY}) rotate(${tilt} ${BODY_PIVOT_X} ${BODY_PIVOT_Y})`);

    // Tail — traveling wave
    setAngle('tail1', 18 * Math.sin(tau));
    setAngle('tail2', 24 * Math.sin(tau + 0.55));
    setAngle('tail3', 30 * Math.sin(tau + 1.10));
    setAngle('tail4', 34 * Math.sin(tau + 1.70));
    setAngle('tail5', 38 * Math.sin(tau + 2.30));
    setAngle('tail6', 42 * Math.sin(tau + 2.90));
    // Legs trail behind, gentle kicks (out of phase)
    setAngle('nHip',  -48 + 8 * Math.sin(tau));
    setAngle('nKnee',  28 + 12 * Math.sin(tau + 0.6));
    setAngle('nAnkle',-14 + 6 * Math.sin(tau + 1.2));
    setAngle('fHip',  -52 - 8 * Math.sin(tau));
    setAngle('fKnee',  32 - 12 * Math.sin(tau + 0.6));
    setAngle('fAnkle',-14 - 6 * Math.sin(tau + 1.2));
    // Arms paddle
    setAngle('nShoulder',  -5 + 45 * Math.sin(tau));
    setAngle('nElbow',     70 + 28 * Math.cos(tau));
    setAngle('nWrist',     22 + 16 * Math.sin(tau + 1));
    setAngle('fShoulder', -10 - 45 * Math.sin(tau));
    setAngle('fElbow',     75 - 28 * Math.cos(tau));
    setAngle('fWrist',     20 - 16 * Math.sin(tau + 1));
    // Head & jaw
    setAngle('neck', -12 + 5 * Math.sin(tau));
    setAngle('jaw',   6 + 4 * Math.sin(tau * 2));

    // Emit bubbles roughly every 90ms
    if (elapsed - lastBubble > 90){
      lastBubble = elapsed;
      if (Math.random() < 0.85) spawnBubble();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
